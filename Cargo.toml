[package]
name = "decsync"
version = "0.1.2"
edition = "2021"
description = "Conflict-free key-value entries synchronized through a shared directory"
repository = "https://github.com/dottorblaster/decsync-rs"
license = "Apache-2.0"
keywords = ["decsync", "synchronization", "key-value", "syncthing", "p2p"]
categories = ["database"]

[dependencies]
serde = "1.0.204"
serde_json = "1.0.122"
chrono = "0.4.38"
thiserror = "2.0.20"
